<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photo Manager</title>
  <meta name="description" content="純前端的照片工具箱: EXIF 檢視與統計、就地分類整理、裁切旋轉、EXIF 相框、照片色卡。照片不會上傳。">
  <meta name="theme-color" content="#252525">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Photo Manager">
  <meta property="og:description" content="純前端的照片工具箱, 照片不會離開這台電腦。">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="assets/images/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Manager">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/photo.css">
</head>

<body>
  <a class="skip-link" href="#page-outlet">跳到主要內容</a>
  <div class="app">
    <nav class="side-nav" id="side-nav" aria-label="主導覽">
      <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true"
        title="收合側邊欄">
        <span class="svg-icon icon-chevron-left" style="width:14px;height:14px" aria-hidden="true"></span>
      </button>
      <a class="brand" href="#/photos">
        <img class="brand-logo" src="assets/images/icon.svg" alt="Photo Manager 標誌">
        <div class="brand-text">
          <div class="brand-name"><strong>PHOTO</strong>MANAGER</div>
          <div class="brand-sub">Manage · Edit</div>
        </div>
      </a>
      <button type="button" id="nav-menu-toggle" class="nav-menu-toggle" aria-label="開啟選單" aria-expanded="false"
        aria-controls="primary-nav" title="選單">
        <span class="svg-icon icon-menu" style="width:20px;height:20px" aria-hidden="true"></span>
      </button>
      <div class="nav-group" id="primary-nav"></div>
      <div class="nav-spacer"></div>
      <div class="nav-foot" id="nav-foot">
        <div>Photo Manager</div>
      </div>
    </nav>

    <main class="main">
      <!-- 照片來源是跨頁共用的狀態, 所以留在外殼上, 只在需要它的頁面顯示。 -->
      <div class="source-bar" id="sourceBar" hidden>
        <div class="source-controls">
          <button class="upload-btn" id="pickFolderBtn">開啟資料夾</button>
          <button class="ghost-btn" id="recentBtn" hidden></button>
          <label class="check" title="連同子資料夾裡的照片一起讀入">
            <input type="checkbox" id="recursiveChk" checked> 含子資料夾
          </label>
          <div class="divider"></div>
          <label class="ghost-btn" for="fileInput">選擇檔案</label>
          <input id="fileInput" type="file"
            accept="image/jpeg,image/jpg,image/tiff,image/heic,image/heif,.heic,.heif" multiple>
          <div class="source-spacer"></div>
          <button class="clear-btn" id="rescanBtn" hidden>重新掃描</button>
          <button class="clear-btn" id="clearBtn">清除</button>
        </div>
        <div class="source-stats" id="sourceStats"></div>
      </div>

      <div class="notice warn" id="fsWarn" hidden></div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-label" id="progressLabel">處理中…</span>
      </div>

      <div id="page-outlet" tabindex="-1" aria-live="polite">
        <div class="state-block" role="status">
          <div class="spinner" aria-hidden="true"></div>載入中…
        </div>
      </div>
    </main>
  </div>

  <!-- HEIC 只在瀏覽器本機轉成可預覽的 JPEG；原始檔不會上傳或被替換。 -->
  <script src="assets/vendor/heic2any.min.js"></script>
  <!-- 照片引擎: 解碼圖片、解析 EXIF、來源管理、檔案搬移。 -->
  <script src="js/engine/image.js"></script>
  <script src="js/engine/exif.js"></script>
  <script src="js/engine/categories.js"></script>
  <script src="js/engine/library.js"></script>
  <script src="js/engine/organize.js"></script>
  <script type="module" src="js/core/main.js"></script>
</body>

</html>
