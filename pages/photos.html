<div class="page-head">
  <h1 class="page-title">照片檢視</h1>
</div>

<div class="toolbar">
  <div class="control-group">
    <label>每排</label>
    <input type="range" id="colSlider" min="1" max="8" value="4">
    <span class="col-count" id="colCount">4</span>
  </div>
  <div class="divider"></div>
  <div class="control-group">
    <label>每頁</label>
    <select id="pageSizeSelect" class="mini-select">
      <option value="30">30</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>
  </div>
  <div class="photo-count" id="photoCount">—</div>
</div>

<details class="field-panel" id="fieldPanel">
  <summary>
    <span class="field-panel-title">EXIF 欄位</span>
    <span class="field-count" id="fieldCount"></span>
  </summary>
  <div class="chip-row" id="chipRow"></div>
</details>

<div id="grid" class="grid"></div>
<div id="photosPagination" class="pagination"></div>
<div id="emptyState" class="empty-state">
  <div class="glyph">◎</div>
  <p>尚未載入照片</p>
</div>
