<div class="settings-head">
  <h1 class="page-title">分類設定</h1>
  <div class="settings-actions">
    <button class="ghost-btn" id="addCatBtn">＋ 新增</button>
    <button class="ghost-btn" id="exportCatBtn">匯出 JSON</button>
    <label class="ghost-btn" for="importCatInput">匯入 JSON</label>
    <input id="importCatInput" type="file" accept="application/json,.json">
    <button class="clear-btn" id="resetCatBtn">重設</button>
  </div>
</div>
<div class="toolbar profile-bar">
  <div class="control-group">
    <label for="profileSelect">設定檔</label>
    <select id="profileSelect" class="mini-select"></select>
  </div>
  <div class="divider"></div>
  <button class="ghost-btn" id="newProfileBtn">新增一套</button>
  <button class="ghost-btn" id="copyProfileBtn">複製這一套</button>
  <button class="ghost-btn" id="renameProfileBtn">重新命名</button>
  <div class="source-spacer"></div>
  <button class="clear-btn" id="deleteProfileBtn">刪除這一套</button>
</div>

<div class="cat-table" id="catTable"></div>
